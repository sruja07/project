# ==========================================
# APPLICATION
# ==========================================
spring.application.name=CyberPro

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/miniproject
spring.datasource.username=root
spring.datasource.password=Admin@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JSP VIEW CONFIGURATION
# ==========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ==========================================
# SERVER
# ==========================================
server.port=8081

# ==========================================
# ERROR
# ==========================================
server.error.include-message=always
# ==========================================
# SPRING SECURITY LOGGING
# ==========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG

# MVC logging
logging.level.org.springframework.web=DEBUG

# Application logging
logging.level.com.project.cyberpro=DEBUG

logging.level.org.springframework.security.authentication=TRACE
logging.level.org.springframework.security.web.authentication=TRACE